services:
  - type: web
    name: stem-idea-generator-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_OPENROUTER
        value: true
      - key: OPENROUTER_API_KEY
        value: REDACTED_SECRET
      - key: SUPABASE_URL
        value: https://satbswbgkcgaddbesgns.supabase.co
      - key: SUPABASE_KEY
        value: REDACTED_SECRET
      # CORS: Set this to your Vercel frontend URL (e.g. https://your-app.vercel.app)
      # Multiple origins can be comma-separated: https://a.vercel.app,https://b.vercel.app
      - key: FRONTEND_URL
        value: https://YOUR_APP.vercel.app
