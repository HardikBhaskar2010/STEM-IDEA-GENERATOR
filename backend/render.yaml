services:
  - type: web
    name: stem-idea-generator-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_OPENROUTER
        value: true
      - key: OPENROUTER_API_KEY
        value: REDACTED_SECRET
      - key: SUPABASE_URL
        value: https://satbswbgkcgaddbesgns.supabase.co
      - key: SUPABASE_KEY
        value: REDACTED_SECRET