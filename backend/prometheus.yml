# Prometheus Configuration for STEM Project Generator Backend
# This configuration file sets up Prometheus to scrape metrics from the backend service

global:
  scrape_interval: 15s      # How frequently to scrape targets
  evaluation_interval: 15s  # How frequently to evaluate rules
  
  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'stem-backend-monitor'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'
# rule_files:
#   - "prometheus_alerts.yml"

# Scrape configurations
scrape_configs:
  # Backend service metrics
  - job_name: 'stem-backend'
    
    # Override the global default and scrape targets from this job every 10 seconds
    scrape_interval: 10s
    scrape_timeout: 5s
    
    # Metrics path defaults to '/metrics'
    metrics_path: '/metrics'
    
    # Scheme defaults to 'http'
    scheme: http
    
    static_configs:
      # For local development
      - targets: ['localhost:8000']
        labels:
          instance: 'backend-local'
          service: 'stem-backend'
      
      # For Docker Compose (uncomment when using Docker)
      # - targets: ['host.docker.internal:8000']
      #   labels:
      #     instance: 'backend-docker'
      #     service: 'stem-backend'
      
      # For production (update with actual host)
      # - targets: ['backend.example.com:8000']
      #   labels:
      #     instance: 'backend-prod'
      #     service: 'stem-backend'
  
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'
          service: 'monitoring'

# Storage configuration
# storage:
#   tsdb:
#     path: /prometheus
#     retention.time: 15d
#     retention.size: 10GB
