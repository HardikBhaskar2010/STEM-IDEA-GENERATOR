<!DOCTYPE html>
<html>
<head>
    <title>API Connection Test</title>
</head>
<body>
    <h1>Universal Chat API Connection Test</h1>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            
            try {
                resultsDiv.innerHTML += '<p>🔍 Testing API connection...</p>';
                
                const apiUrl = 'https://perfection-v2.onrender.com/api/ai-guidance/process-voice';
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        transcript: 'Hello, this is a test',
                        timestamp: new Date().toISOString(),
                        context: {}
                    })
                });
                
                resultsDiv.innerHTML += `<p>📡 Response Status: ${response.status}</p>`;
                
                if (!response.ok) {
                    const errorText = await response.text();
                    resultsDiv.innerHTML += `<p>❌ Error: ${errorText}</p>`;
                    return;
                }
                
                const data = await response.json();
                resultsDiv.innerHTML += `<p>✅ Success! Response:</p>`;
                resultsDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
            } catch (error) {
                resultsDiv.innerHTML += `<p>🚨 Network Error: ${error.message}</p>`;
                console.error('API Test Error:', error);
            }
        }
        
        // Run test on page load
        testAPI();
    </script>
</body>
</html>
