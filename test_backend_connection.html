<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    
    <button onclick="testConnection()">Test Backend Connection</button>
    <button onclick="testAIEndpoint()">Test AI Endpoint</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8001/api';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testConnection() {
            addResult('🔍 Testing backend connection...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Backend connected successfully!<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    addResult(`❌ Backend responded with error: ${response.status}<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                addResult(`❌ Failed to connect to backend: ${error.message}<br><br>Make sure the backend server is running:<br><code>start_backend.bat</code>`, 'error');
            }
        }
        
        async function testAIEndpoint() {
            addResult('🔍 Testing AI endpoint with sample message...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/ai-guidance/process-voice`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        transcript: 'Create an expert level robotics project',
                        timestamp: new Date().toISOString(),
                        context: {}
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ AI endpoint working!<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    addResult(`❌ AI endpoint error: ${response.status}<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                addResult(`❌ AI endpoint failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on load
        window.onload = function() {
            addResult('🚀 Backend Connection Tester Ready', 'info');
            addResult(`📍 Testing URL: ${API_BASE_URL}`, 'info');
        };
    </script>
</body>
</html>
